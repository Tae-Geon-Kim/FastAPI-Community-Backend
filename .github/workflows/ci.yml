name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_USER: ci_test_user
  DB_PASSWORD: ci_test_password
  DB_NAME: Test_CommunityBackendDB
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: 6379
  SECRET_KEY: ci-test-only-secret-key

jobs:
  ci-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: ci_test_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: Test_CommunityBackendDB
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test_user -d Test_CommunityBackendDB"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.10.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Alembic single head
        run: |
          heads="$(alembic heads)"
          echo "$heads"
          test "$(printf '%s\n' "$heads" | grep -c .)" -eq 1

      - name: Migrate fresh DB
        run: |
          test -z "$(alembic current)"
          alembic upgrade head
          test "$(alembic current)" = "$(alembic heads)"

      - name: Pytest
        run: pytest -W error

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t community-backend:ci .
